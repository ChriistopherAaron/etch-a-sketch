<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="in=edge">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Etch-a-Sketch</title>
</head>
<body>
    <div class="top container">
        <span id="grid-toggle" class="material-symbols-outlined">grid_on</span>
        <button id="size-btn">Set Grid Size</button>
    </div>

    <div id="sketch-area" class="container"></div>

    <div id="container">
        <input type="range" min="1" max="100" value="16" class="slider" id="slider">
        <p id="slider-value">16 x 16 (Resolution)</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
